[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "conpty"
version = "0.1.0"
description = "Python bindings for the conpty Rust crate, with a realtime streaming reader"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
]

[tool.maturin]
module-name = "conpty"
features = ["pyo3/extension-module"]
